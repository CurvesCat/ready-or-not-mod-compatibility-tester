name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python sources
        run: python -m compileall ron_mod_tester run_gui.py run_cli.py

      - name: Import core modules
        run: python -c "import ron_mod_tester.nexus.cache; import ron_mod_tester.nexus.client; print('core imports OK')"
